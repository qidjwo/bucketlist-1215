<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SU & SE Bucket & Diary</title>
  <style>
    :root {
      --bg: #fdfbf7;
      --card-bg: #ffffff;
      --text: #2c3437;
      --gray: #8c9398;
      --accent-su: #4a90e2;
      --accent-se: #ff6b81;
      --accent-both: #9b51e0;
      --star: #f5a623;
      --border: #ece8df;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 24px 16px 60px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 560px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    header p {
      font-size: 0.88rem;
      color: var(--gray);
    }

    /* 상단 메인 네비게이션 (버킷리스트 vs 다이어리) */
    .main-nav {
      display: flex;
      background: rgba(0, 0, 0, 0.05);
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 20px;
    }

    .main-nav-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 10px 0;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--gray);
      border-radius: 11px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .main-nav-btn.active {
      background: #fff;
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .card {
      background: var(--card-bg);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }

    /* 공통 폼 스타일 */
    .selector-group {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .selector-group label {
      flex: 1;
      text-align: center;
      padding: 8px 0;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 10px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .selector-group input { display: none; }

    .selector-group label:has(input[value="TOGETHER"]:checked) {
      background: var(--accent-both);
      color: #fff;
      border-color: var(--accent-both);
    }

    .selector-group label:has(input[value="SU"]:checked) {
      background: var(--accent-su);
      color: #fff;
      border-color: var(--accent-su);
    }

    .selector-group label:has(input[value="SE"]:checked) {
      background: var(--accent-se);
      color: #fff;
      border-color: var(--accent-se);
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    input[type="text"], input[type="date"], textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 0.95rem;
      outline: none;
      background: #fafaf9;
    }

    input:focus, textarea:focus {
      border-color: #bbb;
      background: #fff;
    }

    .submit-btn {
      background: #333;
      color: #fff;
      border: none;
      padding: 0 18px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* 리스트 서브탭 */
    .filter-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .filter-btn {
      flex: 1;
      background: none;
      border: none;
      padding: 10px 0;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--gray);
      cursor: pointer;
      position: relative;
    }

    .filter-btn.active {
      color: var(--text);
    }

    .filter-btn.active::after {
      content: "";
      position: absolute;
      bottom: -1px;
      left: 20%;
      width: 60%;
      height: 2px;
      background: var(--text);
    }

    /* 버킷리스트 아이템 */
    .bucket-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bucket-item {
      border-radius: 14px;
      background: #fafaf9;
      border: 1px solid var(--border);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bucket-main-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .item-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }

    .star-btn {
      background: none;
      border: none;
      font-size: 1.25rem;
      color: #d1d1d6;
      cursor: pointer;
      padding: 0 2px;
    }

    .star-btn.starred {
      color: var(--star);
    }

    .custom-checkbox {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      border: 2px solid #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .custom-checkbox.checked {
      background: #333;
      border-color: #333;
    }

    .custom-checkbox.checked::after {
      content: "✓";
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }

    .badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 6px;
      color: #fff;
      flex-shrink: 0;
    }

    .badge.TOGETHER { background: var(--accent-both); }
    .badge.SU { background: var(--accent-su); }
    .badge.SE { background: var(--accent-se); }

    .item-text {
      font-size: 0.95rem;
      word-break: break-all;
    }

    .bucket-item.completed .item-text {
      text-decoration: line-through;
      color: var(--gray);
    }

    .delete-btn {
      background: none;
      border: none;
      color: #c7c7cc;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 2px 6px;
    }

    .delete-btn:hover { color: #ff4d4f; }

    /* 버킷 완료 감상평 영역 */
    .review-container {
      background: #ffffff;
      border-radius: 10px;
      padding: 12px;
      border: 1px dashed var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .review-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--gray);
      margin-bottom: 2px;
    }

    .review-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .review-tag {
      font-size: 0.75rem;
      font-weight: 700;
      width: 32px;
      text-align: center;
      padding: 4px 0;
      border-radius: 6px;
      color: #fff;
      flex-shrink: 0;
    }

    .review-input {
      flex: 1;
      padding: 7px 10px;
      font-size: 0.85rem;
      border-radius: 8px;
    }

    .review-save-btn {
      padding: 7px 12px;
      background: #eee;
      border: none;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .review-save-btn:hover { background: #e0e0e0; }

    /* 다이어리 스타일 */
    .diary-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .diary-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .diary-item {
      background: #fafaf9;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }

    .diary-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .diary-meta {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .diary-date {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--gray);
    }

    .diary-content {
      font-size: 0.93rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .empty-state {
      text-align: center;
      color: var(--gray);
      padding: 32px 0;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>SU & SE 기록소 💫</h1>
      <p>우리들의 버킷리스트와 데이트 일기</p>
    </header>

    <!-- 탭 전환 -->
    <nav class="main-nav">
      <button class="main-nav-btn active" onclick="switchView('bucket', this)">📋 버킷리스트</button>
      <button class="main-nav-btn" onclick="switchView('diary', this)">📖 데이트 다이어리</button>
    </nav>

    <!-- 버킷리스트 화면 -->
    <section id="bucketSection">
      <div class="card">
        <form class="bucket-form" id="bucketForm">
          <div class="selector-group">
            <label>
              <input type="radio" name="creator" value="TOGETHER" checked />
              <span>함께</span>
            </label>
            <label>
              <input type="radio" name="creator" value="SU" />
              <span>SU</span>
            </label>
            <label>
              <input type="radio" name="creator" value="SE" />
              <span>SE</span>
            </label>
          </div>
          <div class="input-row">
            <input type="text" id="bucketInput" placeholder="새로운 버킷리스트를 입력하세요" required />
            <button type="submit" class="submit-btn">추가</button>
          </div>
        </form>
      </div>

      <div class="card">
        <div class="filter-tabs">
          <button class="filter-btn active" onclick="setBucketFilter('all', this)">전체 (<span id="countAll">0</span>)</button>
          <button class="filter-btn" onclick="setBucketFilter('active', this)">진행 중 (<span id="countActive">0</span>)</button>
          <button class="filter-btn" onclick="setBucketFilter('completed', this)">완료 (<span id="countCompleted">0</span>)</button>
        </div>

        <ul class="bucket-list" id="bucketList"></ul>
        <div class="empty-state" id="bucketEmptyState" style="display: none;">버킷리스트가 비어있어요.</div>
      </div>
    </section>

    <!-- 다이어리 화면 -->
    <section id="diarySection" style="display: none;">
      <div class="card">
        <form class="diary-form" id="diaryForm">
          <div class="selector-group">
            <label>
              <input type="radio" name="diaryAuthor" value="SU" checked />
              <span>SU의 일기</span>
            </label>
            <label>
              <input type="radio" name="diaryAuthor" value="SE" />
              <span>SE의 일기</span>
            </label>
          </div>
          <input type="date" id="diaryDate" required />
          <textarea id="diaryContent" rows="3" placeholder="오늘 데이트는 어땠나요? 소중한 기록을 남겨보세요." required></textarea>
          <button type="submit" class="submit-btn" style="padding: 12px 0;">일기 남기기</button>
        </form>
      </div>

      <div class="card">
        <ul class="diary-list" id="diaryList"></ul>
        <div class="empty-state" id="diaryEmptyState" style="display: none;">작성된 일기가 없어요.</div>
      </div>
    </section>
  </div>

  <script>
    // 기본 버킷리스트 샘플 데이터
    const defaultBuckets = [
      { id: 1, text: "야구장 가서 치맥 먹으면서 응원하기", author: "TOGETHER", starred: true, completed: false, reviews: { su: "", se: "" } },
      { id: 2, text: "서로 인생네컷 앨범 한 권 채우기", author: "TOGETHER", starred: false, completed: false, reviews: { su: "", se: "" } },
      { id: 3, text: "둘만의 맛집 지도 리스트 10곳 채우기", author: "TOGETHER", starred: false, completed: false, reviews: { su: "", se: "" } }
    ];

    let bucketItems = JSON.parse(localStorage.getItem("su_se_bucket_items")) || defaultBuckets;
    let diaryItems = JSON.parse(localStorage.getItem("su_se_diary_items")) || [];
    let currentBucketFilter = "all";

    // 날짜 입력 필드 오늘 날짜 기본 세팅
    document.getElementById("diaryDate").valueAsDate = new Date();

    // 네비게이션 전환
    function switchView(tab, btn) {
      document.querySelectorAll(".main-nav-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");

      document.getElementById("bucketSection").style.display = tab === "bucket" ? "block" : "none";
      document.getElementById("diarySection").style.display = tab === "diary" ? "block" : "none";
    }

    /* --- 버킷리스트 로직 --- */
    function saveBucketItems() {
      localStorage.setItem("su_se_bucket_items", JSON.stringify(bucketItems));
      renderBuckets();
    }

    function toggleBucketComplete(id) {
      bucketItems = bucketItems.map(item =>
        item.id === id ? { ...item, completed: !item.completed } : item
      );
      saveBucketItems();
    }

    function toggleBucketStar(id) {
      bucketItems = bucketItems.map(item =>
        item.id === id ? { ...item, starred: !item.starred } : item
      );
      saveBucketItems();
    }

    function deleteBucket(id) {
      bucketItems = bucketItems.filter(item => item.id !== id);
      saveBucketItems();
    }

    function saveReview(id, authorKey) {
      const input = document.getElementById(`review-${authorKey}-${id}`);
      const val = input.value.trim();
      bucketItems = bucketItems.map(item => {
        if (item.id === id) {
          const reviews = item.reviews || { su: "", se: "" };
          reviews[authorKey] = val;
          return { ...item, reviews };
        }
        return item;
      });
      saveBucketItems();
      alert("감상평이 저장되었습니다!");
    }

    function setBucketFilter(filter, el) {
      currentBucketFilter = filter;
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      el.classList.add("active");
      renderBuckets();
    }

    function renderBuckets() {
      // 카운트 계산
      document.getElementById("countAll").textContent = bucketItems.length;
      document.getElementById("countActive").textContent = bucketItems.filter(i => !i.completed).length;
      document.getElementById("countCompleted").textContent = bucketItems.filter(i => i.completed).length;

      const listEl = document.getElementById("bucketList");
      listEl.innerHTML = "";

      // 별표 우선 정렬 (starred: true가 상단)
      let sorted = [...bucketItems].sort((a, b) => (b.starred ? 1 : 0) - (a.starred ? 1 : 0));

      let filtered = sorted.filter(item => {
        if (currentBucketFilter === "active") return !item.completed;
        if (currentBucketFilter === "completed") return item.completed;
        return true;
      });

      document.getElementById("bucketEmptyState").style.display = filtered.length === 0 ? "block" : "none";

      filtered.forEach(item => {
        const reviews = item.reviews || { su: "", se: "" };
        const li = document.createElement("li");
        li.className = `bucket-item ${item.completed ? "completed" : ""}`;

        // 완료 시 감상평 폼 표시
        const reviewSectionHtml = item.completed ? `
          <div class="review-container">
            <span class="review-title">완료 후기 & 한 줄 감상</span>
            <div class="review-row">
              <span class="review-tag" style="background: var(--accent-su)">SU</span>
              <input type="text" id="review-su-${item.id}" class="review-input" placeholder="SU의 감상을 적어주세요" value="${reviews.su || ""}">
              <button class="review-save-btn" onclick="saveReview(${item.id}, 'su')">저장</button>
            </div>
            <div class="review-row">
              <span class="review-tag" style="background: var(--accent-se)">SE</span>
              <input type="text" id="review-se-${item.id}" class="review-input" placeholder="SE의 감상을 적어주세요" value="${reviews.se || ""}">
              <button class="review-save-btn" onclick="saveReview(${item.id}, 'se')">저장</button>
            </div>
          </div>
        ` : "";

        li.innerHTML = `
          <div class="bucket-main-row">
            <div class="item-left">
              <button class="star-btn ${item.starred ? "starred" : ""}" onclick="toggleBucketStar(${item.id})" title="상단 고정">★</button>
              <div class="custom-checkbox ${item.completed ? "checked" : ""}" onclick="toggleBucketComplete(${item.id})"></div>
              <span class="badge ${item.author}">${item.author}</span>
              <span class="item-text">${item.text}</span>
            </div>
            <button class="delete-btn" onclick="deleteBucket(${item.id})" title="삭제">×</button>
          </div>
          ${reviewSectionHtml}
        `;
        listEl.appendChild(li);
      });
    }

    document.getElementById("bucketForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const input = document.getElementById("bucketInput");
      const text = input.value.trim();
      const author = document.querySelector('input[name="creator"]:checked').value;

      if (!text) return;

      bucketItems.unshift({
        id: Date.now(),
        text: text,
        author: author,
        starred: false,
        completed: false,
        reviews: { su: "", se: "" }
      });

      saveBucketItems();
      input.value = "";
    });

    /* --- 다이어리 로직 --- */
    function saveDiaryItems() {
      localStorage.setItem("su_se_diary_items", JSON.stringify(diaryItems));
      renderDiary();
    }

    function deleteDiary(id) {
      diaryItems = diaryItems.filter(item => item.id !== id);
      saveDiaryItems();
    }

    function renderDiary() {
      const listEl = document.getElementById("diaryList");
      listEl.innerHTML = "";

      document.getElementById("diaryEmptyState").style.display = diaryItems.length === 0 ? "block" : "none";

      diaryItems.forEach(item => {
        const li = document.createElement("li");
        li.className = "diary-item";
        li.innerHTML = `
          <div class="diary-header">
            <div class="diary-meta">
              <span class="badge ${item.author}">${item.author}</span>
              <span class="diary-date">${item.date}</span>
            </div>
            <button class="delete-btn" onclick="deleteDiary(${item.id})" title="삭제">×</button>
          </div>
          <div class="diary-content">${item.content}</div>
        `;
        listEl.appendChild(li);
      });
    }

    document.getElementById("diaryForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const author = document.querySelector('input[name="diaryAuthor"]:checked').value;
      const date = document.getElementById("diaryDate").value;
      const content = document.getElementById("diaryContent").value.trim();

      if (!content) return;

      diaryItems.unshift({
        id: Date.now(),
        author: author,
        date: date,
        content: content
      });

      saveDiaryItems();
      document.getElementById("diaryContent").value = "";
    });

    // 초기 렌더링 실행
    renderBuckets();
    renderDiary();
  </script>
</body>
</html>
