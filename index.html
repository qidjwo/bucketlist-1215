<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SU & SE Bucket List</title>
  <style>
    :root {
      --bg: #fdfbf7;
      --card-bg: #ffffff;
      --text: #333333;
      --gray: #8e8e93;
      --accent-su: #4a90e2;
      --accent-se: #ff6b81;
      --accent-both: #9b51e0;
      --border: #f0ede6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 24px 16px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    header p {
      font-size: 0.9rem;
      color: var(--gray);
    }

    .card {
      background: var(--card-bg);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      margin-bottom: 20px;
    }

    /* 입력 폼 */
    .input-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .creator-selector {
      display: flex;
      gap: 8px;
    }

    .creator-selector label {
      flex: 1;
      text-align: center;
      padding: 8px 0;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 10px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .creator-selector input {
      display: none;
    }

    .creator-selector input:checked + span {
      display: block;
      width: 100%;
      height: 100%;
    }

    .creator-selector label:has(input[value="TOGETHER"]:checked) {
      background: var(--accent-both);
      color: #fff;
      border-color: var(--accent-both);
    }

    .creator-selector label:has(input[value="SU"]:checked) {
      background: var(--accent-su);
      color: #fff;
      border-color: var(--accent-su);
    }

    .creator-selector label:has(input[value="SE"]:checked) {
      background: var(--accent-se);
      color: #fff;
      border-color: var(--accent-se);
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    .input-row input[type="text"] {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 0.95rem;
      outline: none;
      background: #fafafa;
    }

    .input-row input[type="text"]:focus {
      border-color: #bbb;
      background: #fff;
    }

    .input-row button {
      background: #333;
      color: #fff;
      border: none;
      padding: 0 18px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .input-row button:active {
      opacity: 0.8;
    }

    /* 탭 메뉴 */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      padding: 10px 0;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--gray);
      cursor: pointer;
      position: relative;
    }

    .tab-btn.active {
      color: var(--text);
    }

    .tab-btn.active::after {
      content: "";
      position: absolute;
      bottom: -1px;
      left: 20%;
      width: 60%;
      height: 2px;
      background: var(--text);
    }

    /* 리스트 */
    .bucket-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bucket-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-radius: 14px;
      background: #fafaf9;
      border: 1px solid var(--border);
      transition: all 0.2s ease;
    }

    .item-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .custom-checkbox {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      border: 2px solid #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .custom-checkbox.checked {
      background: #333;
      border-color: #333;
    }

    .custom-checkbox.checked::after {
      content: "✓";
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }

    .badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 6px;
      color: #fff;
      flex-shrink: 0;
    }

    .badge.TOGETHER { background: var(--accent-both); }
    .badge.SU { background: var(--accent-su); }
    .badge.SE { background: var(--accent-se); }

    .item-text {
      font-size: 0.95rem;
      word-break: break-all;
    }

    .bucket-item.completed {
      opacity: 0.55;
      background: #f4f4f4;
    }

    .bucket-item.completed .item-text {
      text-decoration: line-through;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #bbb;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px;
      margin-left: 8px;
    }

    .delete-btn:hover {
      color: #ff4d4f;
    }

    .empty-state {
      text-align: center;
      color: var(--gray);
      padding: 32px 0;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>SU & SE 버킷리스트 📋</h1>
      <p>함께 채워나가는 우리들의 기록</p>
    </header>

    <!-- 작성 영역 -->
    <div class="card">
      <form class="input-form" id="bucketForm">
        <div class="creator-selector">
          <label>
            <input type="radio" name="creator" value="TOGETHER" checked />
            <span>우리 둘 다</span>
          </label>
          <label>
            <input type="radio" name="creator" value="SU" />
            <span>SU의 추천</span>
          </label>
          <label>
            <input type="radio" name="creator" value="SE" />
            <span>SE의 추천</span>
          </label>
        </div>
        <div class="input-row">
          <input type="text" id="bucketInput" placeholder="하고 싶은 데이트를 적어보세요" required />
          <button type="submit">추가</button>
        </div>
      </form>
    </div>

    <!-- 리스트 영역 -->
    <div class="card">
      <div class="tabs">
        <button class="tab-btn active" onclick="setFilter('all', this)">전체 (<span id="countAll">0</span>)</button>
        <button class="tab-btn" onclick="setFilter('active', this)">진행 중 (<span id="countActive">0</span>)</button>
        <button class="tab-btn" onclick="setFilter('completed', this)">완료 (<span id="countCompleted">0</span>)</button>
      </div>

      <ul class="bucket-list" id="bucketList"></ul>
      <div class="empty-state" id="emptyState" style="display: none;">리스트가 비어있어요.</div>
    </div>
  </div>

  <script>
    // 최초 실행 시 기본 리스트 세팅
    const defaultList = [
      { id: 1, text: "야구장 가서 치맥 먹으면서 응원하기", author: "TOGETHER", completed: false },
      { id: 2, text: "서로 인생네컷 앨범 한 권 채우기", author: "TOGETHER", completed: false },
      { id: 3, text: "둘만의 맛집 지도 리스트 10곳 채우기", author: "TOGETHER", completed: false }
    ];

    let bucketItems = JSON.parse(localStorage.getItem("su_se_bucket_items")) || defaultList;
    let currentFilter = "all";

    const bucketForm = document.getElementById("bucketForm");
    const bucketInput = document.getElementById("bucketInput");
    const bucketList = document.getElementById("bucketList");
    const emptyState = document.getElementById("emptyState");

    function saveItems() {
      localStorage.setItem("su_se_bucket_items", JSON.stringify(bucketItems));
      render();
    }

    function toggleItem(id) {
      bucketItems = bucketItems.map(item => 
        item.id === id ? { ...item, completed: !item.completed } : item
      );
      saveItems();
    }

    function deleteItem(id) {
      bucketItems = bucketItems.filter(item => item.id !== id);
      saveItems();
    }

    function setFilter(filter, element) {
      currentFilter = filter;
      document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
      element.classList.add("active");
      render();
    }

    function updateCounts() {
      const activeCount = bucketItems.filter(i => !i.completed).length;
      const completedCount = bucketItems.filter(i => i.completed).length;
      document.getElementById("countAll").textContent = bucketItems.length;
      document.getElementById("countActive").textContent = activeCount;
      document.getElementById("countCompleted").textContent = completedCount;
    }

    function render() {
      updateCounts();
      bucketList.innerHTML = "";

      const filteredItems = bucketItems.filter(item => {
        if (currentFilter === "active") return !item.completed;
        if (currentFilter === "completed") return item.completed;
        return true;
      });

      if (filteredItems.length === 0) {
        emptyState.style.display = "block";
      } else {
        emptyState.style.display = "none";
        filteredItems.forEach(item => {
          const li = document.createElement("li");
          li.className = `bucket-item ${item.completed ? "completed" : ""}`;
          
          li.innerHTML = `
            <div class="item-left">
              <div class="custom-checkbox ${item.completed ? "checked" : ""}" onclick="toggleItem(${item.id})"></div>
              <span class="badge ${item.author}">${item.author}</span>
              <span class="item-text">${item.text}</span>
            </div>
            <button class="delete-btn" onclick="deleteItem(${item.id})" title="삭제">×</button>
          `;
          bucketList.appendChild(li);
        });
      }
    }

    bucketForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = bucketInput.value.trim();
      const author = document.querySelector('input[name="creator"]:checked').value;

      if (!text) return;

      const newItem = {
        id: Date.now(),
        text: text,
        author: author,
        completed: false
      };

      bucketItems.unshift(newItem);
      saveItems();
      bucketInput.value = "";
    });

    // 초기 화면 렌더링
    render();
  </script>
</body>
</html>
